# Builds and tests both tools on every push and pull request (Windows PowerShell 5.1, like the stores).
#
# Nothing is published here: the TBS script only reaches stores through release.yml (version tag),
# MiniGhost through the committed MiniGhost/MiniGhost.ps1 on main - this checks that file is
# exactly what the sources build.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  tbs-maintenance:
    name: TBS Maintenance Script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sources formatted
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\build\Format-Sources.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (sources -> one script)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\build\Build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\tests\TBS_Maintenance_SelfTest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  minighost:
    name: MiniGhost
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Committed MiniGhost.ps1 matches the sources
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\MiniGhost\build\Build.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Self-test
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\MiniGhost\tests\MiniGhost_SelfTest.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ui-screenshots:
    name: UI screenshots (both tools, off-screen)
    runs-on: windows-latest
    # Visual review aid: renders the main windows, menus and dialogs to PNG (artifact "ui-screenshots").
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: TBS smoke run with screenshots
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\build\Build.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\tests\Smoke.ps1 -Seconds 10 -Screenshot "$env:RUNNER_TEMP\shots"

      - name: MiniGhost smoke run with screenshots
        if: always()
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\MiniGhost\tests\Smoke.ps1 -Screenshot "$env:RUNNER_TEMP\shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: warn

  antivirus:
    name: Antivirus check (Defender AMSI + file scan)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Defender signatures, real-time protection on (AMSI needs it)
        shell: powershell
        continue-on-error: true
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue
          Update-MpSignature -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate

      - name: Scan the shipped scripts
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\TBS_Maintenance\build\Build.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\AV_Scan.ps1
          if ($LASTEXITCODE -eq 1) { exit 1 }
